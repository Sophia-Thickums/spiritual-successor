[package]
name = "spirit-gui"
version = "1.1.0"
edition = "2021"
description = "spiritual-successor — the native desktop app (GTK4 + libadwaita)"

[[bin]]
name = "spirit-gui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde_json = "1"
async-channel = "2"

[profile.release]
opt-level = 2
